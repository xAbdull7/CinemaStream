name: cinema_stream
description: "A fast, modern Netflix-style media player for Windows 11 with auto resume, metadata, and subtitle support."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Video Playback Engine (libmpv hardware acceleration)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.9

  # Windows 11 Window Customization (Acrylic / Mica & Frameless Titlebar)
  window_manager: ^0.3.9

  # Database for Watch History & Resume Progress (SQLite)
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24

  # File system & path utilities
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.0

  # Networking & APIs (TMDB & Subtitles)
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # UI & Utilities
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

