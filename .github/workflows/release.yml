name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Upgrade libmpv to v0.42 (Native RTX Super Resolution)
        shell: pwsh
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z"
          $zip = "$env:TEMP\mpv-dev.7z"
          $out = "$env:TEMP\mpv-extract"
          Write-Host "Downloading modern libmpv with RTX Super Resolution..."
          Invoke-WebRequest -Uri $url -OutFile $zip
          7z x -y $zip -o"$out" "libmpv-2.dll"
          Copy-Item "$out\libmpv-2.dll" -Destination "build\windows\x64\runner\Release\libmpv-2.dll" -Force
          Write-Host "Successfully upgraded libmpv-2.dll in release runner directory!"

      - name: Compile Inno Setup Installer
        run: |
          iscc installer/cinemastream_setup.iss

      - name: Determine Tag Name
        id: get_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "CinemaStream ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            installer/output/*.exe

